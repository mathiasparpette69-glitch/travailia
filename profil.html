<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Profil - JobIA</title>
</head>

<body>

    <h1>Créer mon profil JobIA</h1>

    <form>

        <label>Nom :</label><br>
        <input type="text"><br><br>


        <label>Métier recherché :</label><br>
        <input type="text" placeholder="Exemple : mécanicien"><br><br>


        <label>Ville :</label><br>
        <input type="text"><br><br>


        <label>Compétences :</label><br>
        <textarea placeholder="Décris tes compétences"></textarea><br><br>


        <button>
            Enregistrer mon profil
        </button>

    </form>

</body>

</html>
